<dialog id="quiz-dialog" class="max-w-lg max-h-[90vh] overflow-y-auto">
  <header class="dialog-header flex items-center gap-2">
    <span class="sparkles-icon"></span>
    <h2>Find Your Perfect Plant</h2>
  </header>

  <!-- Quiz Questions -->
  <div class="quiz-content space-y-6">
    <div class="progress-section">
      <div class="flex justify-between text-sm text-gray-500 mb-2">
        <span class="question-count">Question X of Y</span>
        <span class="progress-percent">Z%</span>
      </div>
      <progress class="progress-bar" value="0" max="100"></progress>
    </div>

    <div class="question-section">
      <h3 class="question-title"></h3>
      <div class="options-list space-y-3">
        <!-- Option cards dynamically generated here -->
      </div>
    </div>

    <button class="back-btn">Back</button>
  </div>

  <!-- Recommendations -->
  <div class="recommendations-section space-y-4">
    <div class="loading-state">
      <span class="loader"></span>
      <p>Analyzing your answers and finding perfect plants...</p>
    </div>

    <div class="recommendations-output bg-green-50 border border-green-200 rounded-lg p-6">
      <h3>Your Personalized Recommendations</h3>
      <div class="recommendations-text"></div>
    </div>

    <button class="explore-btn">Explore These Plants</button>
  </div>
</dialog>
