<div class="min-h-screen flex flex-col" style="background-color: var(--warm-bg)">
  <header class="bg-gradient-to-r from-green-500 to-emerald-600 p-6 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center gap-3 text-white">
      <div class="w-12 h-12 bg-white/20 backdrop-blur rounded-2xl flex items-center justify-center">
        <svg class="w-7 h-7" data-icon="camera"></svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold">Plant Health Specialist</h1>
        <p class="text-green-50">Upload plant photos for instant health analysis</p>
      </div>
    </div>
  </header>

  <main class="flex-1 overflow-auto p-4">
    <div class="max-w-4xl mx-auto space-y-4" id="message-container"></div>
  </main>

  <footer class="border-t border-green-100 bg-white p-4">
    <div class="max-w-4xl mx-auto">
      <div id="upload-preview"></div>

      <div class="flex gap-2">
        <input id="file-input" type="file" accept="image/*" class="hidden" />
        <button id="upload-btn" class="flex-shrink-0 border-green-200 hover:bg-green-50 icon-btn">
          <svg class="w-5 h-5 text-green-600" data-icon="camera"></svg>
        </button>

        <textarea
          id="user-input"
          placeholder="Upload a plant photo to get started..."
          class="resize-none border-green-200 focus:border-green-400 flex-1"
          rows="1"
        ></textarea>

        <button id="send-btn" class="flex-shrink-0 bg-green-600 hover:bg-green-700 icon-btn">
          <svg class="w-5 h-5" data-icon="send"></svg>
        </button>
      </div>

      <p class="text-xs text-gray-500 mt-2 text-center">
        💡 Upload a clear photo of your plant for the best analysis
      </p>
    </div>
  </footer>
</div>
